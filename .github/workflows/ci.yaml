name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, edited]
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  validate_azure_task_presence:
    name: Validate Azure task is present in PR body
    if: ${{ github.event_name == 'pull_request' && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - id: print
        name: Some
        run: |
          echo $SENDER
          echo $GITHUB
        env:
          SENDER: ${{ github.event.sender.type }}
          GITHUB: ${{ toJson(github) }}
      - id: task
        name: Get task-id from body comment
        uses: actions/github-script@v6
        with:
          result-encoding: string
          script: |
            const body = ${{ toJson(github.event.pull_request.body) }};
            const azureTask = body?.match(/(?<=AB#)[0-9]+/);
            if (!azureTask) {
              core.setFailed('Azure task presence validation fail');
            }


  update_board_task_status:
    name: Update board task status on PR merge
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
            node-version: '20'
      - name: Install dependencies
        run: |
          npm --prefix ./.github/actions/update-board/ install
      - name: Update board
        uses: ./.github/actions/update-board
        with:
          ado-token: ${{ secrets.ADO_TOKEN }}
          new-state: 'Done'