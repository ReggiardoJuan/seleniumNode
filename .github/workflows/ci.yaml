      #   run: |
      #     echo '${{ fromJson(steps.get_json.outputs.JSON).sha }}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install commit-and-tag-version auto-changelog

      - name: Get tag name for release
        id: get_tag_name
        run: |
          TAG_NAME=$(npx commit-and-tag-version --skip.changelog --skip.commit --dry-run | grep 'tagging release' | awk '{print $NF}')
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Bump version, create tag, and update changelog
        run: |
          npx commit-and-tag-version --skip.changelog --skip.commit
      - name: Push changes with REST API
        run: |
          echo Obtener el SHA actual del archivo package.json
          PACKAGE_JSON_SHA=$(curl -s -H "Authorization: token ${{ env.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/contents/package.json | jq -r '.sha')

          echo Subir cambio
          echo $(base64 package.json)
          curl -v --trace-ascii - -X PUT -H "Authorization: token ${{ env.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"message": "chore(release): bump version to ${{ steps.get_tag_name.outputs.tag }}", "content": ""$(base64 package.json)""}' \
            https://api.github.com/repos/${{ github.repository }}/contents/package.json

