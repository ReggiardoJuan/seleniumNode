name: CI

on:
  pull_request:
    branches:
      - main
    types: [closed]

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  update_board_task_status:
    permissions: write-all
    name: Generate release
    if: ${{ github.event.pull_request.merged && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm i release-please
      - name: Update board
        uses: ./.github/actions/update-board
        with:
          ado-token: ${{ secrets.ADO_TOKEN }}
          new-state: 'Done'