name: CI

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened]

  push:
    branches: [main]

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  check_ticket:
    name: Check ticker number is present in PR description
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
        - name: Get context
          run: |
              echo "${{toJson(github)}}"

  update_board_task_status:
    name: Upadte board task status on PR merge
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - id: get_pr
        name: Get task id from associated pull request
        uses: actions/github-script@v6
        with:
          result-encoding: string
          script: |
            const pullRequest = $(gh api /repos/$REPOSITORY/commits/$EVENT_SHA/pulls);
            return pullRequest.body.match(/(?<=AB#)[0-9]+/)[0];
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}

      - id: task
        name: Get context
        run: |
            echo "${{steps.get_pr.outputs.result}}"

