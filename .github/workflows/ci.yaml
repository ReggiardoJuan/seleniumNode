name: release

on:
  pull_request:
    branches:
      - main
    types: [closed]

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  release_and_changelog:
    permissions: write-all
    name: Generate release notes and changelog
    if: ${{ github.event.pull_request.merged && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create temporary package.json
        run: |
          mkdir -p ./tmp
          echo '{
            "dependencies": {
              "auto-changelog": "^2.0.0",
              "commit-and-tag-version": "^3.0.0"
            }
          }' > ./tmp/package.json

      - name: Install dependencies
        run: |
          npm --prefix ./tmp install

      - name: Bump version, create tag, and update changelog
        run: |
          npx commit-and-tag-version --skip.changelog --skip.commit
          npx auto-changelog -p --template .github/templates/changelog.hbs --commit-limit false
          git add .
          git commit -m "chore(release): bump version and update changelog"
          git push origin main --follow-tags

      - name: Publish GitHub Release with auto-generated notes
        run: |
          echo "${{ github }}"
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{
              "tag_name": "${{ github.ref_name }}",
              "target_commitish": "main",
              "name": "${{ github.ref_name }}",
              "draft": false,
              "prerelease": false,
              "generate_release_notes": true
            }'
