name: CI

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened]

  push:
    branches: [main]

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  check_ticket:
    name: Check ticker number is present in PR description
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
        - name: Get context
          run: |
              echo "${{toJson(github)}}"

  update_board_task_status:
    name: Upadte board task status on PR merge
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - id: task
        name: Get context
        run: |
            echo "${{toJson(github)}}"
            echo "\n\n"
            echo "${{toJson(github.event)}}"