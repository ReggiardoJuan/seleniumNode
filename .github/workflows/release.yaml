name: Generate release notes and changelog
on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.pull_request.merged && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install commit-and-tag-version

      - name: Get tag name for release
        id: get_tag_name
        run: |
          TAG_NAME=$(npx commit-and-tag-version --skip.changelog --skip.commit --dry-run | grep 'tagging release' | awk '{print $NF}')
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Bump version and update changelog
        run: |
          npx commit-and-tag-version --skip.changelog --skip.commit

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git rebase origin/main

          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.get_tag_name.outputs.tag }} and update changelog"
          git push origin main

      - name: Publish release with auto-generated notes
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{
              "tag_name": "${{ steps.get_tag_name.outputs.tag }}",
              "target_commitish": "main",
              "name": "${{ steps.get_tag_name.outputs.tag }}",
              "draft": false,
              "prerelease": false,
              "generate_release_notes": true
            }'
