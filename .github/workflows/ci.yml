name: Generate release notes and changelog
on:
  pull_request:
    types:
      - closed

permissions: write-all

jobs:
  release:
    if: ${{ github.event.pull_request.merged && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install commit-and-tag-version

      - name: Get tag name for release
        id: get_tag_name
        run: |
          TAG_NAME=$(npx commit-and-tag-version --skip.changelog --skip.commit --dry-run | grep 'tagging release' | awk '{print $NF}')
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Bump version and commit
        run: |
          npx commit-and-tag-version --bumpFiles: package.json --skip.changelog --skip.commit
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.get_tag_name.outputs.tag }}"

      - name: Push changes to a temporary branch
        id: branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEMP_BRANCH="release-$(date +%Y%m%d%H%M%S)"
          echo "branch=$TEMP_BRANCH" >> "$GITHUB_OUTPUT"
          git push --follow-tags origin HEAD:$TEMP_BRANCH

      - name: Create PR to main
        id: pr
        continue-on-error: false
        run: |
          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H 'Content-Type: application/json' \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{
              "title": "Automated bump version ${{ steps.get_tag_name.outputs.tag }}",
              "head": "${{ steps.branch.outputs.branch }}",
              "base": "main",
              "body": "Bump version to ${{ steps.get_tag_name.outputs.tag }}"
            }')
          PR_NUMBER=$(echo $PR_RESPONSE | jq .number)
          echo "Pull Request created: $PR_NUMBER"
          echo "PR=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge pull request to main
        if: success()
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.PR }}/merge \
            -d '{"merge_method": "squash"}'

      - name: Publish release with auto-generated notes
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{
              "tag_name": "${{ steps.get_tag_name.outputs.tag }}",
              "target_commitish": "main",
              "name": "${{ steps.get_tag_name.outputs.tag }}",
              "draft": false,
              "prerelease": false,
              "generate_release_notes": true
            }'

  generate-changelog:
    needs: [release]
    uses: ReggiardoJuan/seleniumNode/.github/workflows/changelog.yml@main
